<svg width="550" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f57c00"/>
    </marker>
  </defs>
  
  <text x="275" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#f57c00"><b>Abstract Methods</b></text>
  
  <rect x="20" y="70" width="240" height="250" fill="#fce4ec" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#c2185b"><b>Database (ABC)</b></text>
  
  <rect x="40" y="110" width="200" height="30" fill="#ffcdd2" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">@abstractmethod connect() → bool</text>
  
  <rect x="40" y="150" width="200" height="30" fill="#ffcdd2" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="140" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">@abstractmethod disconnect() → None</text>
  
  <rect x="40" y="190" width="200" height="30" fill="#ffcdd2" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="140" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">@abstractmethod execute(query) → list</text>
  
  <rect x="40" y="230" width="200" height="30" fill="#ffcdd2" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="140" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">@property @abstractmethod</text>
  <text x="140" y="265" text-anchor="middle" font-family="Arial" font-size="10" fill="#c2185b">is_connected → bool</text>
  
  <rect x="40" y="280" width="200" height="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#388e3c">transaction(queries) → list</text>
  <text x="140" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">(concrete - uses abstract)</text>
  
  <line x1="260" y1="200" x2="310" y2="200" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="310" y="70" width="220" height="250" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="420" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#388e3c"><b>PostgreSQLDatabase</b></text>
  
  <rect x="330" y="120" width="180" height="35" fill="#fff" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="420" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">def connect(): → True</text>
  
  <rect x="330" y="165" width="180" height="35" fill="#fff" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="420" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">def disconnect(): print()</text>
  
  <rect x="330" y="210" width="180" height="35" fill="#fff" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="420" y="235" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">def execute(q): → [result]</text>
  
  <rect x="330" y="255" width="180" height="35" fill="#fff" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="420" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">@property is_connected: bool</text>
  
  <rect x="310" y="330" width="220" height="35" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="420" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#f57c00">All abstract methods implemented ✓</text>
</svg>