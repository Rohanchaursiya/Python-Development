<svg width="550" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c"/>
    </marker>
  </defs>
  
  <text x="275" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#388e3c"><b>Runtime Polymorphism</b></text>
  
  <!-- Base class -->
  <rect x="215" y="60" width="120" height="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="275" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#388e3c"><b>Animal</b></text>
  <text x="275" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">speak()</text>
  
  <!-- Arrows -->
  <line x1="180" y1="110" x2="80" y2="150" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275" y1="110" x2="275" y2="150" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="110" x2="470" y2="150" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Dog -->
  <rect x="20" y="160" width="120" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="80" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2"><b>Dog</b></text>
  <text x="80" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">speak() → "Woof!"</text>
  
  <!-- Cat -->
  <rect x="215" y="160" width="120" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="275" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2"><b>Cat</b></text>
  <text x="275" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">speak() → "Meow!"</text>
  
  <!-- Bird -->
  <rect x="410" y="160" width="120" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="470" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2"><b>Bird</b></text>
  <text x="470" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">speak() → "Tweet!"</text>
  
  <!-- Runtime dispatch -->
  <rect x="175" y="240" width="200" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="275" y="265" text-anchor="middle" font-family="Arial" font-size="12" fill="#f57c00">make_sound(animal) → Dynamic Dispatch</text>
</svg>