<svg width="500" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2"/>
    </marker>
  </defs>
  
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#1976d2"><b>Compile-Time Polymorphism</b></text>
  
  <!-- Base class -->
  <rect x="50" y="80" width="180" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2">Single Class</text>
  <text x="140" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Multiple Methods</text>
  
  <!-- Arrows to methods -->
  <line x1="230" y1="110" x2="280" y2="110" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Method variants -->
  <rect x="290" y="60" width="160" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="370" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#f57c00">method(a, b)</text>
  
  <rect x="290" y="110" width="160" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="370" y="135" text-anchor="middle" font-family="Arial" font-size="12" fill="#f57c00">method(a, b, c=0)</text>
  
  <rect x="290" y="160" width="160" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="370" y="185" text-anchor="middle" font-family="Arial" font-size="12" fill="#f57c00">method(*args)</text>
</svg>