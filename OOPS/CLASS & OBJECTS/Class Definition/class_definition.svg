<svg width="500" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2"/>
    </marker>
  </defs>
  
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#1976d2"><b>Class Definition</b></text>
  
  <!-- Class box -->
  <rect x="100" y="70" width="300" height="150" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="250" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2"><b>class Person:</b></text>
  
  <!-- Class attributes -->
  <rect x="120" y="110" width="260" height="30" fill="#fff" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="250" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">class_attr = "shared"</text>
  
  <!-- Methods -->
  <rect x="120" y="150" width="260" height="30" fill="#fff" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">def __init__(self, name): self.name = name</text>
  
  <rect x="120" y="190" width="260" height="30" fill="#fff" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">def greet(self): return f"Hi {self.name}"</text>
  
  <!-- Arrow to instances -->
  <line x1="250" y1="220" x2="150" y2="260" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="220" x2="350" y2="260" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Instances -->
  <rect x="80" y="260" width="120" height="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="140" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#388e3c">person1</text>
  <text x="140" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">name="Alice"</text>
  
  <rect x="300" y="260" width="120" height="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="360" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#388e3c">person2</text>
  <text x="360" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">name="Bob"</text>
</svg>