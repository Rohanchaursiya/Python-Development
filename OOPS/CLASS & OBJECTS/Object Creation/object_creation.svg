<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c"/>
    </marker>
  </defs>
  
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#388e3c"><b>Object Creation (Instantiation)</b></text>
  
  <!-- Class -->
  <rect x="175" y="60" width="150" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="250" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#1976d2"><b>Class: Person</b></text>
  <text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">__init__(name, age)</text>
  
  <!-- Arrows -->
  <line x1="200" y1="120" x2="100" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="120" x2="250" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="400" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Instances -->
  <rect x="40" y="170" width="120" height="70" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="100" y="190" text-anchor="middle" font-family="Arial" font-size="13" fill="#388e3c"><b>person1</b></text>
  <text x="100" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">id: 0x7f8a...</text>
  <text x="100" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">name="Alice", age=30</text>
  
  <rect x="190" y="170" width="120" height="70" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="250" y="190" text-anchor="middle" font-family="Arial" font-size="13" fill="#388e3c"><b>person2</b></text>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">id: 0x7f8b...</text>
  <text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">name="Bob", age=25</text>
  
  <rect x="340" y="170" width="120" height="70" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="13" fill="#388e3c"><b>person3</b></text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">id: 0x7f8c...</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">name="Carol", age=28</text>
  
  <!-- Key points -->
  <rect x="50" y="260" width="400" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="250" y="280" text-anchor="middle" font-family="Arial" font-size="11" fill="#f57c00">Each instance: unique identity (id), independent state, same behavior</text>
</svg>